name: Build and Release VideoCompressor

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Download and prepare FFmpeg
        run: |
          python -c "import urllib.request, zipfile, os, shutil; print('Downloading FFmpeg...'); urllib.request.urlretrieve('https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip', 'ffmpeg.zip'); print('Extracting...'); z = zipfile.ZipFile('ffmpeg.zip'); [shutil.copyfileobj(z.open(m), open(os.path.basename(m), 'wb')) for m in z.namelist() if os.path.basename(m) in ('ffmpeg.exe', 'ffprobe.exe')]; z.close(); os.remove('ffmpeg.zip'); print('Done!')"

      - name: Build Executable
        run: |
          python build_exe.py

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: VideoCompressor.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
