name: Build and Release VideoCompressor

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Download and prepare FFmpeg
        shell: pwsh
        run: |
          Write-Host "Downloading FFmpeg release archive..."
          curl.exe -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Write-Host "Extracting ffmpeg.exe and ffprobe.exe..."
          tar.exe -xf ffmpeg.zip --strip-components=2 "*/bin/ffmpeg.exe" "*/bin/ffprobe.exe"
          Remove-Item ffmpeg.zip -Force
          if (-not (Test-Path "ffmpeg.exe") -or -not (Test-Path "ffprobe.exe")) {
            throw "ffmpeg.exe or ffprobe.exe was not extracted properly!"
          }
          Write-Host "FFmpeg binaries successfully prepared."

      - name: Build Executable
        shell: pwsh
        run: |
          python build_exe.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoCompressor
          path: VideoCompressor.exe
          if-no-files-found: error

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: VideoCompressor.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
